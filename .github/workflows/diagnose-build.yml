# Manual diagnostic for the release build: runs the same restore and CLI build the publishing
# workflow runs, on the same runner image, with verbose output. Uploads nothing.

name: Diagnose build

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Environment
        run: |
          dotnet --info
          dotnet nuget list source
          ls -la local-feed

      - name: Restore (detailed)
        continue-on-error: true
        working-directory: src/Macrogotchi
        run: dotnet restore Macrogotchi.csproj -r linux-x64 -v:detailed

      - name: Build with the plugin CLI
        continue-on-error: true
        run: |
          dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.5
          macrodeck-plugin build --source src/Macrogotchi --output "${RUNNER_TEMP}/artifacts"
          ls -la "${RUNNER_TEMP}/artifacts"
