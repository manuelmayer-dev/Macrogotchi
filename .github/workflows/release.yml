# Publishing a GitHub release builds the plugin with its tag as the version (written into
# manifest.json by the workflow), runs the tests in Macrogotchi.slnx, runs the plugin's conformance
# suite on a disposable stub host and uploads the build to the Macro Deck Platform. The build then
# waits in the Creator Portal's build library, where a release is started from it.
#
# The jobs run in the Macro Deck workflow, not here: that is what lets the Platform tell an approved
# build apart from any other workflow. Only its upload job can request the OIDC token, so neither the
# build nor the tests nor the plugin itself ever run where the upload credential is available.

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    uses: Macro-Deck-App/GitHub-Actions/.github/workflows/publish-plugin.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ github.event.release.tag_name }}
      source: src/Macrogotchi
      # Pinned: `--prerelease` would pick 3.0.0-preview.10, which sorts above the newer betas.
      cli-version: 3.0.0-beta.7
      changelog: ${{ github.event.release.body }}
